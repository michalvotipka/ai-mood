# Production stack on a single server (see deploy/README.md):
#   docker compose -f docker-compose.prod.yml up -d --build
# Variables come from .env next to this file on the server (template: deploy/prod.env.example).
# Only Caddy (web) is published to the internet; Keycloak is bound to localhost:48080 for the
# admin console through an SSH tunnel.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # Used by postgres-init, only when the volume is created.
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - db-data:/var/lib/postgresql
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    # Imports keycloak/realm.prod.json only when the realm doesn't exist yet. Later changes are made
    # in the admin console and kept in the database.
    command: ["start", "--import-realm"]
    ports:
      - "127.0.0.1:48080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${AUTH_DOMAIN:?}
      # The admin console through the SSH tunnel.
      KC_HOSTNAME_ADMIN: http://localhost:48080
      # TLS ends in Caddy, which forwards plain HTTP with X-Forwarded-* headers.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Temporary admin of the master realm, replace it in the admin console after the first start.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      # Keeps Keycloak within a small server's memory.
      JAVA_OPTS_KC_HEAP: -Xms64m -Xmx512m
      # Placeholders in realm.prod.json.
      APP_URL: https://${APP_DOMAIN:?}
      BFF_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?}
    volumes:
      - ./keycloak/realm.prod.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      db:
        condition: service_healthy

  # Sessions of the BFF. Nothing worth persisting.
  redis:
    image: redis:8-alpine
    restart: unless-stopped

  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    init: true
    environment:
      APP_URL: https://${APP_DOMAIN}
      BACKEND_URL: http://backend:43100
      REDIS_URL: redis://redis:6379
      KEYCLOAK_URL: https://${AUTH_DOMAIN}/realms/ai-mood
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/ai-mood
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?}
    depends_on:
      - redis
      - keycloak
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    init: true
    environment:
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?}
      AI_MODEL: ${AI_MODEL:-}
      AI_OCR_MODEL: ${AI_OCR_MODEL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      OIDC_ISSUER_URL: https://${AUTH_DOMAIN}/realms/ai-mood
      OIDC_JWKS_URL: http://keycloak:8080/realms/ai-mood/protocol/openid-connect/certs
    depends_on:
      db:
        condition: service_healthy

  # Caddy with the built frontend: HTTPS, static files, and the reverse proxy to the BFF and Keycloak.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates. Without a volume every restart asks Let's Encrypt again (rate limits).
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bff
      - keycloak

volumes:
  db-data:
  caddy-data:
  caddy-config:
