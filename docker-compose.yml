services:
  db:
    image: postgres:18-alpine
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - db-data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    # Imports keycloak/realm.json on start (no volume, so a new container always starts from it).
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-43300}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens carry this URL (the one the browser uses) as their issuer, also when the backend
      # reaches Keycloak inside the compose network as keycloak:8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-43300}
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro

  # Sessions of the BFF. Nothing worth persisting.
  redis:
    image: redis:8-alpine

  # The only service the browser talks to (through the frontend's origin): sign-in with Keycloak,
  # the session cookie, and /api forwarded to the backend with the access token.
  bff:
    build: ./bff
    environment:
      BACKEND_URL: http://backend:43100
      REDIS_URL: redis://redis:6379
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/ai-mood
      # Matches keycloak/realm.json, which is for local development only.
      KEYCLOAK_CLIENT_SECRET: bff-dev-secret
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    depends_on:
      - redis
      - keycloak
      - backend
    volumes:
      - ./bff:/app
      - /app/node_modules

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-43100}:43100"
    env_file:
      - path: .env
        required: false
    # Inside the compose network the backend reaches the db service directly, on Postgres' own port.
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      OIDC_JWKS_URL: http://keycloak:8080/realms/ai-mood/protocol/openid-connect/certs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-43200}:43200"
    environment:
      BFF_PROXY_TARGET: http://bff:43400
    depends_on:
      - bff
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db-data:
