services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-43100}:43100"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-43200}:43200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
