name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, bff, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - if: matrix.app == 'frontend'
        run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      # Compose requires it in every command, but the build never uses it.
      - run: docker compose build
        env:
          SESSION_SECRET: not-used-by-the-build
      - name: production images
        run: docker compose -f docker-compose.prod.yml --env-file deploy/prod.env.example build
        # Compose requires them in every command, but the build never uses them.
        env:
          APP_DOMAIN: example.com
          AUTH_DOMAIN: auth.example.com
          AI_GATEWAY_API_KEY: x
          POSTGRES_PASSWORD: x
          KEYCLOAK_DB_PASSWORD: x
          KEYCLOAK_ADMIN_PASSWORD: x
          KEYCLOAK_CLIENT_SECRET: x
          SESSION_SECRET: x
